[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-pro-realworld"
version = "0.1.0"
description = "Production-ready Skill-Pro (Non-Parametric PPO & Skill-MDP) applied to SRE/DevOps Incident Triage with a Hybrid Cloud+Local Verifier architecture and real-time Observability UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
local-hf = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.6.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
skill-pro-ui = "skill_pro_rw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skill_pro_rw.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
